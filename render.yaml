services:
  - type: web
    name: lichess-analytics-portal
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DRIVE_PARENT_FOLDER_ID
        value: 12PIh1S55cgjBMLpJ4G1cFJb-lAxHikqg
      - key: GITHUB_REPO
        value: ChukwumaKingsley/lichess_report_preprocessor
      - key: GITHUB_WORKFLOW_FILE
        value: lichess_pipeline.yaml
      - key: GITHUB_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_CREDENTIALS
        sync: false
      - key: LICHESS_TOKEN
        sync: false
      - key: PORTAL_TRIGGER_PASSCODE
        sync: false
      - key: PORTAL_USER_TOKENS
        sync: false
      - key: PORTAL_VIEW_PASSCODE
        sync: false
      - key: ALLOWED_TRIGGER_PLAYERS
        sync: false
      - key: TRIGGER_COOLDOWN_SECONDS
        value: "120"
      - key: TRIGGER_MAX_PER_HOUR
        value: "10"
